name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  build-and-test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: hello-ubuntu
            binary: target/release/hello
          - os: windows-latest
            artifact: hello-windows
            binary: target/release/hello.exe
          - os: macos-latest
            artifact: hello-macos
            binary: target/release/hello
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run CI script on Linux and macOS
        if: matrix.os != 'windows-latest'
        run: bash ci.sh

      - name: Run CI script on Windows
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: ci.bat

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
